name: CI

on:
  push:
    branches: [main]
  # Draft PRs don't run CI; marking one ready does.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to the same PR or feature branch cancels the run it
# supersedes; pushes to main and develop always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop') }}

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm --filter @eekodigital/raster test:coverage
      - run: cd docs && pnpm build
      - run: cd docs && pnpm exec playwright install --with-deps chromium
      - run: cd docs && pnpm test:e2e

  size:
    name: Bundle size
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Per-entry min+gzip budget; also fails if any JS entry imports CSS.
      - run: pnpm size
