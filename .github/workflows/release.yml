name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Creates a "Version Packages" PR when changesets exist.
      # When that PR merges, has-changesets will be false — time to publish.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          pr-title: "chore: version package"

      # Publish with OIDC trusted publishing (no NPM_TOKEN needed).
      # Trusted publishing requires npm >= 11.5 and npm's own publish path —
      # pnpm publish doesn't forward the OIDC identity correctly. Node 24
      # ships with npm >= 11.5 so no manual install step is needed.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: npm publish --provenance --access public
