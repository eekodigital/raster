name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # changesets pushes the version branch
      pull-requests: write # changesets opens the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Creates a "Version Packages" PR when changesets exist.
      # When that PR merges, has-changesets will be false — time to publish.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          pr-title: "chore: version package"
          # Format what `changeset version` writes (CHANGELOG.md doesn't match
          # the formatter), so the version PR passes CI as opened.
          version: pnpm run version-packages

      # Publish with OIDC trusted publishing (no NPM_TOKEN needed).
      # Trusted publishing requires npm >= 11.5 and npm's own publish path —
      # pnpm publish doesn't forward the OIDC identity correctly. Node 24
      # ships with npm >= 11.5 so no manual install step is needed.
      #
      # has-changesets is also false on ordinary pushes with nothing pending,
      # so only publish when this package.json version isn't on npm yet.
      - id: npm-version
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.npm-version.outputs.published == 'false'
        run: npm publish --provenance --access public

      # Tag each published version (vX.Y.Z, annotated) and publish its
      # changelog section as a GitHub release. Skips when the tag exists, so
      # re-runs and ordinary pushes to main are no-ops.
      - if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
          awk -v h="## $version" '$0 == h { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > release-notes.md
          echo "npm: https://www.npmjs.com/package/@eekodigital/raster/v/$version" >> release-notes.md
          gh release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md --latest
