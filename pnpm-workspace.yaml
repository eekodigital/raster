packages:
  - "."
  - "docs"

# pnpm 11 defaults strictDepBuilds to true: dependency build scripts must be
# explicitly approved or install fails. esbuild and sharp are trusted native
# deps that need their install scripts to set up prebuilt platform binaries.
allowBuilds:
  esbuild: true
  sharp: true

# Security floor for dev-only transitive deps of the docs toolchain
# (esbuild GHSA-g7r4-m6w7-qqqr; yaml <2.8.3). Carried over from #68.
overrides:
  "esbuild@<0.28.1": ">=0.28.1"
  "yaml@<2.8.3": ">=2.8.3"
  # postcss-selector-parser GHSA-rj75-hqrm-r3gf (moderate), via the docs-only
  # chain @expressive-code/core > postcss-nested 6, which asks for ^6.
  "postcss-selector-parser@6": "7.1.6"
  # http-cache-semantics GHSA-ch52-4w7c-c8xp (high), via astro (docs only),
  # which asks for ^4.2.0. Drop once astro resolves 4.3.0+ on its own.
  "http-cache-semantics@<4.3.0": ">=4.3.0"
